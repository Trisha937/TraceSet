name: Render Backend Keepalive

on:
  schedule:
    # Ping every 10 minutes to prevent Render free tier from sleeping (threshold is 15 mins)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping Health Endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          echo "Pinging TraceSet health endpoint..."
          response=$(curl -s -o /dev/null -w "%{http_code}" --max-time 45 https://traceset.onrender.com/api/health || true)
          echo "HTTP Response: $response"
